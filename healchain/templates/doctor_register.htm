{% extends "base.htm" %}

{% block title %}Doctor Registration – HealChain{% endblock %}

{% block head_extra %}
<style>
  .form-page { padding:2rem; }
  form { max-width:600px; margin:0 auto; }
  label { display:block; margin-top:1rem; font-weight:bold; }
  input, select { width:100%; padding:0.6rem; margin-top:0.5rem; border-radius:4px; border:none; background:#fff; color:#000; }
  button { margin-top:2rem; background:#009688; color:#fff; padding:0.8rem 1.5rem; border-radius:6px; border:none; cursor:pointer; }
  button:hover { background:#00796B; }
</style>
{% endblock %}

{% block content %}
<div class="form-page">
  <h1>Doctor Registration</h1>
  <form action="{{ url_for('doctor_register_post') }}" method="POST" enctype="multipart/form-data">
    <label for="name">Full Name</label>
    <input type="text" id="name" name="name" required />
    <label for="clinic">Clinic Name</label>
    <input type="text" id="clinic" name="clinic" required />
    <label for="specialization">Specialization</label>
    <input type="text" id="specialization" name="specialization" required />
    <label for="address">Clinic Address</label>
    <input type="text" id="address" name="address" required />
    <label for="email">Email</label>
    <input type="email" id="email" name="email" required />
    <label for="contact">Contact Number</label>
    <input type="tel" id="contact" name="contact" required />
    <label for="experience">Years of Practice</label>
    <input type="number" id="experience" name="experience" required />
    <label for="license">License ID</label>
    <input type="text" id="license" name="license" required />
    <label for="idproof">Upload ID Proof</label>
    <input type="file" id="idproof" name="idproof" accept=".pdf,.jpg,.png" required />
    <label for="photo">Profile Photo</label>
    <input type="file" id="photo" name="photo" accept=".jpg,.png" required />
    <label for="timings">Clinic Timings</label>
    <input type="text" id="timings" name="timings" placeholder="e.g. Mon–Fri, 10am–5pm" required />
    <label>Doctor ID (Auto-generated)</label>
    <input type="text" value="Will be auto-assigned" readonly />
    <label for="password">Create Password</label>
    <input type="password" id="password" name="password" required />
    <label for="confirm">Verify Password</label>
    <input type="password" id="confirm" name="confirm" required />
    <button type="submit">Register Doctor</button>
  </form>
</div>
{% endblock %}

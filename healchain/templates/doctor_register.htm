{% extends "base.html" %}
{% block title %}Doctor Registration – HealChain{% endblock %}
{% block content %}
<section class="py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8">
        <h1 class="text-teal fw-bold text-center mb-4">Doctor Registration</h1>
        <div class="card-dark p-4 rounded">
          <form action="{{ url_for('doctor_register_post') }}" method="POST" enctype="multipart/form-data">
            <div class="mb-3">
              <label for="name" class="form-label fw-bold">Full Name</label>
              <input type="text" class="form-control" id="name" name="name" required />
            </div>
            <div class="mb-3">
              <label for="clinic" class="form-label fw-bold">Clinic Name</label>
              <input type="text" class="form-control" id="clinic" name="clinic" required />
            </div>
            <div class="mb-3">
              <label for="specialization" class="form-label fw-bold">Specialization</label>
              <input type="text" class="form-control" id="specialization" name="specialization" required />
            </div>
            <div class="mb-3">
              <label for="address" class="form-label fw-bold">Clinic Address</label>
              <input type="text" class="form-control" id="address" name="address" required />
            </div>
            <div class="mb-3">
              <label for="email" class="form-label fw-bold">Email</label>
              <input type="email" class="form-control" id="email" name="email" required />
            </div>
            <div class="mb-3">
              <label for="contact" class="form-label fw-bold">Contact Number</label>
              <input type="tel" class="form-control" id="contact" name="contact" required />
            </div>
            <div class="mb-3">
              <label for="experience" class="form-label fw-bold">Years of Practice</label>
              <input type="number" class="form-control" id="experience" name="experience" required />
            </div>
            <div class="mb-3">
              <label for="license" class="form-label fw-bold">License ID</label>
              <input type="text" class="form-control" id="license" name="license" required />
            </div>
            <div class="mb-3">
              <label for="idproof" class="form-label fw-bold">Upload ID Proof</label>
              <input type="file" class="form-control" id="idproof" name="idproof" accept=".pdf,.jpg,.png" required />
            </div>
            <div class="mb-3">
              <label for="photo" class="form-label fw-bold">Profile Photo</label>
              <input type="file" class="form-control" id="photo" name="photo" accept=".jpg,.png" required />
            </div>
            <div class="mb-3">
              <label for="timings" class="form-label fw-bold">Clinic Timings</label>
              <input type="text" class="form-control" id="timings" name="timings" placeholder="e.g. Mon–Fri, 10am–5pm" required />
            </div>
            <div class="mb-3">
              <label class="form-label fw-bold">Doctor ID (Auto-generated)</label>
              <input type="text" class="form-control" value="Will be auto-assigned" readonly />
            </div>
            <div class="mb-3">
              <label for="password" class="form-label fw-bold">Create Password</label>
              <input type="password" class="form-control" id="password" name="password" required />
            </div>
            <div class="mb-4">
              <label for="confirm" class="form-label fw-bold">Verify Password</label>
              <input type="password" class="form-control" id="confirm" name="confirm" required />
            </div>
            <button type="submit" class="btn btn-teal w-100">Register Doctor</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}

{% extends "base.html" %}
{% block title %}Create Account – HealChain{% endblock %}
{% block content %}
<section class="py-5 text-center">
  <div class="container">
    <h1 class="text-teal fw-bold mb-3">Create Your HealChain Account</h1>
    <p class="mb-4">Choose your role to begin registration:</p>
    <a href="{{ url_for('doctor_register') }}" class="btn btn-teal btn-lg me-3 mb-2">
      <i class="fas fa-user-md me-2"></i>I am a Doctor
    </a>
    <a href="{{ url_for('patient_register') }}" class="btn btn-teal btn-lg mb-2">
      <i class="fas fa-user me-2"></i>I am a Patient
    </a>
  </div>
</section>
{% endblock %}

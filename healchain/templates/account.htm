<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account – HealChain</title>
  <link rel="icon" type="image/png" href="/static/img/favicon.png">
  
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #000000;
      color: #FFFFFF;
      text-align: center;
      padding: 3rem 1rem;
    }

    h1 {
      color: #009688;
      margin-bottom: 2rem;
    }

    .role-link {
      text-decoration: none;
    }

    .role-btn {
      display: inline-block;
      background-color: #009688;
      color: #FFFFFF;
      border: none;
      padding: 1rem 2rem;
      margin: 1rem;
      font-size: 1.2rem;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .role-btn:hover {
      background-color: #00796B;
    }
  </style>
</head>
<body>
  <h1>Create Your HealChain Account</h1>
  <p>Choose your role to begin registration:</p>

  <!-- Buttons wrapped in anchor tags pointing to .htm files -->
 <a href="{{ url_for('doctor_register') }}" class="role-link">
  <button class="role-btn">I am a Doctor</button>
</a>

<a href="{{ url_for('patient_register') }}" class="role-link">
  <button class="role-btn">I am a Patient</button>
</a>

</body>
</html>

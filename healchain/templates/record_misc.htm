{% extends "base.html" %}
{% block title %}Record Miscellaneous Data – HealChain{% endblock %}
{% block content %}
<section class="py-4">
  <div class="container" style="max-width:700px">
    <h1 class="text-teal fw-bold mb-4">Record Miscellaneous Data</h1>
    <div class="card-dark p-4 rounded">
      <form method="POST" enctype="multipart/form-data" action="{{ url_for('patient_record_misc') }}">
        <div class="mb-3">
          <label class="form-label fw-bold">Date</label>
          <input type="date" class="form-control" name="date" />
        </div>
        <div class="mb-3">
          <label class="form-label fw-bold">Time</label>
          <input type="time" class="form-control" name="time" />
        </div>
        <div class="mb-3">
          <label class="form-label fw-bold">Notes</label>
          <textarea class="form-control" name="notes" rows="4"></textarea>
        </div>
        <div class="mb-4">
          <label class="form-label fw-bold">Upload file (any format)</label>
          <input type="file" class="form-control" name="upload" />
        </div>
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-teal">Submit</button>
          <a class="btn btn-outline-secondary" href="{{ url_for('patient_dashboard') }}">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</section>
{% endblock %}

{% extends "base.html" %}
{% block title %}Select Patient – HealChain{% endblock %}
{% block content %}
<section class="py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-7">
        <div class="card-dark p-4 rounded">
          <h1 class="text-teal fw-bold text-center mb-4">Select a Patient</h1>
          <form method="POST" action="{{ url_for('doctor_view') }}" novalidate>
            <div class="mb-4">
              <label for="patientSelect" class="form-label fw-bold">Patient registered under you</label>
              <select class="form-select" id="patientSelect" name="selected_patient" required>
                <option value="" disabled selected>Select a patient</option>
                {% for patient in registered_patients %}
                  <option value="{{ patient.patient_id }}">{{ patient.patient_name }} — ID: {{ patient.patient_id }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="d-flex gap-2 flex-wrap">
              <button type="submit" class="btn btn-teal">
                <i class="fas fa-eye me-1"></i>View Records
              </button>
              <button type="submit" formaction="{{ url_for('download_patient_data_from_form') }}" class="btn btn-outline-light">
                <i class="fas fa-download me-1"></i>Download Data
              </button>
              <button type="button" class="btn btn-outline-secondary" onclick="document.getElementById('patientSelect').selectedIndex = 0;">
                Clear
              </button>
            </div>
          </form>
          <div class="text-muted mt-3 small">If your patient list is empty, add patients first or refresh the page.</div>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}

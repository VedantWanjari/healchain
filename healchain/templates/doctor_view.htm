<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Select Patient – HealChain</title>
    <link rel="icon" type="image/png" href="/static/img/favicon.png">
  <style>
    :root { --accent:#009688; --bg:#000; --card:#0b0b0b; --muted:#bdbdbd; }
    html,body { height:100%; margin:0; font-family: 'Segoe UI', sans-serif; background:var(--bg); color:#fff; }
    .wrap {
      max-width:700px;
      margin:6vh auto;
      padding:1.5rem;
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border-radius:10px;
      box-shadow: 0 6px 24px rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.04);
    }
    h1 { margin:0 0 1rem 0; color:var(--accent); font-size:1.4rem; text-align:center; }
    form { display:flex; gap:1rem; align-items:center; justify-content:center; flex-wrap:wrap; }
    label { display:block; color:#fff; font-weight:600; margin-bottom:0.25rem; text-align:left; width:100%; }
    .field {
      width:100%;
      max-width:480px;
    }
    select {
      width:100%;
      padding:0.6rem 0.75rem;
      border-radius:8px;
      border:1px solid rgba(255,255,255,0.08);
      background:#0f0f0f;
      color:#fff;
      font-size:1rem;
      outline:none;
    }
    select:focus { box-shadow:0 0 0 4px rgba(0,150,136,0.08); border-color:var(--accent); }
    .controls { display:flex; gap:0.5rem; align-items:center; }
    button {
      padding:0.6rem 0.85rem;
      border-radius:8px;
      border:none;
      font-weight:600;
      cursor:pointer;
    }
    button.primary {
      background:var(--accent);
      color:#fff;
    }
    button.ghost {
      background:transparent;
      color:var(--muted);
      border:1px solid rgba(255,255,255,0.06);
    }
    .hint { color:var(--muted); font-size:0.9rem; text-align:center; margin-top:0.75rem; }
    @media (max-width:520px) {
      .controls { flex-direction:column; width:100%; }
      button { width:100%; }
      .field { max-width:100%; }
    }
  </style>
</head>
<body>
  <div class="wrap" role="main" aria-labelledby="pageTitle">
    <h1 id="pageTitle">Select a Patient</h1>

    <form method="POST" action="{{ url_for('doctor_view') }}" novalidate>
      <div class="field">
        <label for="patientSelect">Patient registered under you</label>
        <select id="patientSelect" name="selected_patient" required>
          <option value="" disabled selected>Select a patient</option>
          {% for patient in registered_patients %}
           <option value="{{ patient.patient_id }}">{{ patient.patient_name }} — ID: {{ patient.patient_id }}</option>

          {% endfor %}
        </select>
      </div>


<div class="controls" style="align-self:center;">
  <button type="submit" class="primary">View Records</button>
  <button type="submit" formaction="{{ url_for('download_patient_data_from_form') }}" class="ghost">Download Data</button>
  <button type="button" class="ghost" onclick="document.getElementById('patientSelect').selectedIndex = 0;">Clear</button>
</div>




    </form>

    <div class="hint">If your patient list is empty, add patients first or refresh the page.</div>
  </div>
</body>
</html>

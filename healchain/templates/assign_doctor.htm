{% extends "base.html" %}
{% block title %}Assign Doctor – HealChain{% endblock %}
{% block content %}
<section class="py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-7">
        <h1 class="text-teal fw-bold mb-4">Assign Patient: {{ patient.patient_name }}</h1>
        <div class="card-dark p-4 rounded">
          <form method="POST">
            <div class="mb-3">
              <label class="form-label fw-bold">New Doctor ID</label>
              <input class="form-control" name="new_doctor_id" list="doctors" placeholder="Type doctor id" required />
              <datalist id="doctors">
                {% for d in doctors %}
                  <option value="{{ d.doctor_id }}">{{ d.name }}</option>
                {% endfor %}
              </datalist>
            </div>
            <div class="mb-3">
              <label class="form-label fw-bold">Keep recording for me?</label>
              <select class="form-select" name="keep_recording">
                <option value="yes">Yes (both doctors can view)</option>
                <option value="no">No (only assigned doctor views)</option>
              </select>
            </div>
            <div class="text-muted small mb-3">Previous patient data is preserved and not erased.</div>
            <button type="submit" class="btn btn-teal w-100">Assign</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}

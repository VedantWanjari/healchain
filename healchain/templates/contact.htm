{% extends "base.html" %}
{% block title %}Contact Us – HealChain{% endblock %}
{% block content %}
<section class="py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-7">
        <h2 class="text-teal fw-bold mb-2 text-center">Contact Us</h2>
        <p class="text-center mb-4">If you have any questions or feedback, feel free to reach out to us at <strong>sadsasd@zxsd.com</strong> or use the form below.</p>
        <div class="card-dark p-4 rounded">
          <form action="{{ url_for('submit_feedback') }}" method="POST">
            <div class="mb-3">
              <label for="name" class="form-label fw-bold">Name</label>
              <input type="text" class="form-control" id="name" name="name" required />
            </div>
            <div class="mb-3">
              <label for="email" class="form-label fw-bold">Email</label>
              <input type="email" class="form-control" id="email" name="email" required />
            </div>
            <div class="mb-3">
              <label for="message" class="form-label fw-bold">Message</label>
              <textarea class="form-control" id="message" name="message" rows="5" required></textarea>
            </div>
            <button type="submit" class="btn btn-teal w-100">Submit</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}

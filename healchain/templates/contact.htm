{% extends "base.htm" %}

{% block title %}Contact Us – HealChain{% endblock %}

{% block head_extra %}
<style>
  .contact-section { padding: 3rem 1rem; text-align: center; }
  .contact-section h2 { font-size: 1.8rem; color: #009688; margin-bottom: 1rem; }
  .contact-form { max-width: 500px; margin: 0 auto; text-align: left; }
  .contact-form input, .contact-form textarea { width:100%; padding:0.6rem; margin-bottom:1rem; border:none; border-radius:4px; background:#fff; color:#000; }
  .contact-form button { background:#009688; color:#fff; padding:0.6rem 1.2rem; border-radius:4px; border:none; cursor:pointer; }
  .contact-form button:hover { background:#00796B; }
  @media (max-width:600px) { .contact-section h2 { font-size:1.5rem; } }
</style>
{% endblock %}

{% block content %}
<section class="contact-section">
  <h2>Contact Us</h2>
  <p>If you have any questions or feedback, feel free to reach out to us at <strong>sadsasd@zxsd.com</strong> or use the form below.</p>

  <form class="contact-form" action="{{ url_for('submit_feedback') }}" method="POST">
    <label for="name">Name</label>
    <input type="text" id="name" name="name" required />
    <label for="email">Email</label>
    <input type="email" id="email" name="email" required />
    <label for="message">Message</label>
    <textarea id="message" name="message" rows="5" required></textarea>
    <button type="submit">Submit</button>
  </form>
</section>
{% endblock %}

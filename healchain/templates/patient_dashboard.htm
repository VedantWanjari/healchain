{% extends "base.html" %}
{% block title %}Patient Dashboard – HealChain{% endblock %}
{% block content %}
<section class="py-4">
  <div class="container" style="max-width:700px">
    <h1 class="text-teal fw-bold text-center mb-4">Upload Daily Health Data</h1>
    {% if patient %}
      <div class="text-center mb-3">
        Logged in as <strong>{{ patient.patient_name }}</strong> (ID: <strong>{{ patient.patient_id }}</strong>)
      </div>
    {% endif %}
    <div class="card-dark p-4 rounded">
      <form action="{{ url_for('patient_daily_post') }}" method="POST">
        <div class="mb-3">
          <label for="date" class="form-label fw-bold">Date</label>
          <input type="date" class="form-control" id="date" name="date" required />
        </div>
        <div class="mb-3">
          <label for="patient_id" class="form-label fw-bold">Patient ID</label>
          <input type="text" class="form-control" id="patient_id" name="patient_id" required
                 value="{{ patient.patient_id if patient and patient.patient_id else '' }}" />
        </div>
        <div class="mb-3">
          <label for="sugar" class="form-label fw-bold">Blood Sugar (mg/dL)</label>
          <input type="number" class="form-control" id="sugar" name="sugar" required />
        </div>
        <div class="mb-3">
          <label for="weight" class="form-label fw-bold">Weight (kg)</label>
          <input type="number" class="form-control" id="weight" name="weight" required />
        </div>
        <div class="mb-4">
          <label for="bp" class="form-label fw-bold">Blood Pressure (e.g. 120/80)</label>
          <input type="text" class="form-control" id="bp" name="bp" required />
        </div>
        <button type="submit" class="btn btn-teal w-100">Submit Data</button>
      </form>
    </div>
  </div>
</section>
{% endblock %}

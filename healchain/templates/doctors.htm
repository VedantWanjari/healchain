{% extends "base.htm" %}

{% block title %}Register Patient – HealChain{% endblock %}

{% block head_extra %}
<style>
  .form-page { padding:2rem; }
  form { max-width:500px; margin:0 auto; }
  label { display:block; margin-top:1rem; font-weight:bold; }
  input, select { width:100%; padding:0.6rem; margin-top:0.5rem; border-radius:4px; border:none; background:#fff; color:#000; }
  button { margin-top:2rem; background:#009688; color:#fff; padding:0.8rem 1.5rem; border-radius:6px; border:none; cursor:pointer; }
  button:hover { background:#00796B; }
</style>
{% endblock %}

{% block content %}
<div class="form-page">
  <h1>Register Patient</h1>
  {% if doctor %}
    <label>Doctor</label>
    <input type="text" value="{{ doctor.name }} ({{ doctor.doctor_id }})" readonly />
  {% endif %}

  <form action="{{ url_for('doctor_patient_register_post') }}" method="POST">
    <label for="doctor">Doctor Name</label>
    <input type="text" id="doctor" name="doctor" required />
    <label for="patient">Patient Name</label>
    <input type="text" id="patient" name="patient" required />
    <label for="age">Patient Age</label>
    <input type="number" id="age" name="age" required />
    <label for="gender">Gender</label>
    <select id="gender" name="gender" required>
      <option value="">Select</option>
      <option>Male</option>
      <option>Female</option>
      <option>Other</option>
    </select>
    <label>Patient ID (Auto-generated)</label>
    <input type="text" value="Will be auto-assigned" readonly />
    <label for="password">Create Password</label>
    <input type="password" id="password" name="password" required />
    <button type="submit">Register Patient</button>
  </form>
</div>
{% endblock %}

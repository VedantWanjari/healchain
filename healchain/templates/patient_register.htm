{% extends "base.htm" %}

{% block title %}Patient Registration – HealChain{% endblock %}

{% block head_extra %}
<style>
  .form-page { padding:2rem; }
  h1 { text-align:center; color:#009688; margin-bottom:2rem; }
  form { max-width:500px; margin:0 auto; }
  label { display:block; margin-top:1rem; font-weight:bold; color:#fff; }
  input, select { width:100%; padding:0.6rem; margin-top:0.5rem; border-radius:4px; border:none; background:#fff; color:#000; }
  button { margin-top:2rem; background:#009688; color:#fff; border:none; padding:0.8rem 1.5rem; font-size:1rem; border-radius:6px; cursor:pointer; }
  button:hover { background:#00796B; }
</style>
{% endblock %}

{% block content %}
<div class="form-page">
  <h1>Patient Registration</h1>
  <form action="{{ url_for('patient_register_post') }}" method="POST">
    <label for="doctor">Doctor Name</label>
    <input type="text" id="doctor" name="doctor" required />

    <label for="patient">Patient Name</label>
    <input type="text" id="patient" name="patient" required />

    <label for="age">Patient Age</label>
    <input type="number" id="age" name="age" required />

    <label for="gender">Gender</label>
    <select id="gender" name="gender" required>
      <option value="">Select</option>
      <option>Male</option>
      <option>Female</option>
      <option>Other</option>
    </select>

    <label for="patientid">Patient ID (optional, leave blank for auto)</label>
    <input type="text" id="patientid" name="patientid" />

    <label for="password">Create Password</label>
    <input type="password" id="password" name="password" required />

    <button type="submit">Register Patient</button>
  </form>
</div>
{% endblock %}

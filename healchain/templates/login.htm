{% extends "base.html" %}
{% block title %}Login – HealChain{% endblock %}
{% block content %}
<section class="py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <h2 class="text-teal fw-bold text-center mb-4">Log In to Your Account</h2>
        <div class="card-dark p-4 rounded">
          <form action="{{ url_for('login_post') }}" method="POST">
            <div class="mb-3">
              <label for="userid" class="form-label fw-bold">User ID</label>
              <input type="text" class="form-control" id="userid" name="userid" required />
            </div>
            <div class="mb-3">
              <label for="password" class="form-label fw-bold">Password</label>
              <input type="password" class="form-control" id="password" name="password" required />
            </div>
            <div class="mb-4">
              <label for="role" class="form-label fw-bold">Role</label>
              <select class="form-select" id="role" name="role" required>
                <option value="">Select Role</option>
                <option value="doctor">Doctor</option>
                <option value="patient">Patient</option>
              </select>
            </div>
            <button type="submit" class="btn btn-teal w-100">Log In</button>
          </form>
          <div class="text-center mt-3">
            Don't have an account? <a href="{{ url_for('account') }}" class="text-teal fw-bold">Create one here</a>
          </div>
        </div>
        {% if error %}
          <div id="error-popup" class="alert alert-danger mt-3" role="alert">
            {{ error }}
          </div>
          <script>
            setTimeout(() => {
              const el = document.getElementById('error-popup');
              if (el) el.style.display = 'none';
            }, 4000);
          </script>
        {% endif %}
      </div>
    </div>
  </div>
</section>
{% endblock %}

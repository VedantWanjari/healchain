{% extends "base.html" %}
{% block title %}Register Patient – HealChain{% endblock %}
{% block content %}
<section class="py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-7">
        <h1 class="text-teal fw-bold text-center mb-4">Register Patient</h1>
        <div class="card-dark p-4 rounded">
          {% if doctor %}
            <div class="mb-3">
              <label class="form-label fw-bold">Doctor</label>
              <input type="text" class="form-control" value="{{ doctor.name }} ({{ doctor.doctor_id }})" readonly />
            </div>
          {% endif %}
          <form action="{{ url_for('doctor_patient_register_post') }}" method="POST">
            <div class="mb-3">
              <label for="doctor" class="form-label fw-bold">Doctor Name</label>
              <input type="text" class="form-control" id="doctor" name="doctor" required />
            </div>
            <div class="mb-3">
              <label for="patient" class="form-label fw-bold">Patient Name</label>
              <input type="text" class="form-control" id="patient" name="patient" required />
            </div>
            <div class="mb-3">
              <label for="age" class="form-label fw-bold">Patient Age</label>
              <input type="number" class="form-control" id="age" name="age" required />
            </div>
            <div class="mb-3">
              <label for="gender" class="form-label fw-bold">Gender</label>
              <select class="form-select" id="gender" name="gender" required>
                <option value="">Select</option>
                <option>Male</option>
                <option>Female</option>
                <option>Other</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label fw-bold">Patient ID (Auto-generated)</label>
              <input type="text" class="form-control" value="Will be auto-assigned" readonly />
            </div>
            <div class="mb-4">
              <label for="password" class="form-label fw-bold">Create Password</label>
              <input type="password" class="form-control" id="password" name="password" required />
            </div>
            <button type="submit" class="btn btn-teal w-100">Register Patient</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
